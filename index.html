<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Center App - SAINS QUALITY COMPUTER</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
 
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      margin: 0;
      min-height: 100vh;
    }
 
    header {
      background: #020617;
      padding: 15px 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }
 
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
 
    .card {
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
 
    input, select {
      padding: 12px;
      margin: 6px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #020617;
      color: white;
      outline: none;
    }

    .file-input-group {
      display: inline-block;
      margin: 6px;
    }

    .file-input-group label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    button {
      padding: 12px 20px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    
    button:hover { opacity: 0.85; }
 
    .save { background: #22c55e; color: white; }
    .logout { background: #ef4444; color: white; }
    .excel { background: #3b82f6; color: white; }
    .print { background: #f59e0b; color: white; }
    .hapus {
      background: #ef4444;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
 
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
 
    th, td {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      text-align: center;
      vertical-align: middle;
    }
 
    th { background: #020617; }
    tr:hover { background: #020617; }
 
    .loginbox {
      max-width: 350px;
      margin: 100px auto;
      background: #111827;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
    }

    .img-container {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .img-preview {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    @media print {
      body { background: white; color: black; }
      header, .card:first-child, .hapus, #jam { display: none !important; }
      .card { background: white; box-shadow: none; padding: 0; }
      th, td { border: 1px solid #000; color: black; }
      th { background: #eee; }
    }
  </style>
</head>
 
<body>
 
  <!-- BOX LOGIN -->
  <div id="login">
    <div class="loginbox">
      <h2>🔐 LOGIN ADMIN</h2>
      <input type="text" id="user" placeholder="Username"><br>
      <input type="password" id="pass" placeholder="Password"><br>
      <button class="save" onclick="login()">LOGIN</button>
    </div>
  </div>
 
  <!-- APLIKASI UTAMA -->
  <div id="app" style="display:none;">
    <header>
      <div class="header-brand">
        <img src="logo.png" style="height:50px;" alt="Logo" onerror="this.style.display='none'">
        <div>
          <div style="font-size:20px; font-weight:bold;">TOKO SERVICE SAINS QUALITY COMPUTER</div>
          <div style="font-size:12px; color:#94a3b8;">Data Barang Masuk &amp; Keluar</div>
        </div>
      </div>
      <button type="button" class="logout" onclick="logout()">🚪 Logout</button>
    </header>

    <div id="jam" style="text-align:center; margin-top:15px; font-size:14px; color:#94a3b8;"></div>
 
    <div class="container">
      <!-- FORM INPUT -->
      <div class="card">
        <h3>Input Barang Service</h3>
        <form id="formService">
          <input type="date" id="tanggal" required>
          <input type="text" id="nama" placeholder="Nama Barang" required>
          <input type="text" id="customer" placeholder="Customer" required>
          <input type="number" id="biaya" placeholder="Biaya Service (Rp)" min="0">
          <input type="text" id="keterangan" placeholder="Keterangan (Keluhan/Kerusakan)">
          
          <select id="status">
            <option value="Masuk">Barang Masuk</option>
            <option value="Keluar">Barang Keluar</option>
          </select>
          <br>

          <div class="file-input-group">
            <label>Foto 1:</label>
            <input type="file" id="foto1" accept="image/*">
          </div>
          <div class="file-input-group">
            <label>Foto 2:</label>
            <input type="file" id="foto2" accept="image/*">
          </div>
          <div class="file-input-group">
            <label>Foto 3:</label>
            <input type="file" id="foto3" accept="image/*">
          </div>

          <br><br>
          <button type="submit" class="save" id="btnSimpan">Simpan</button>
          <button type="button" class="excel" onclick="downloadExcel()">Excel</button>
          <button type="button" class="print" onclick="printData()">Print</button>
        </form>
      </div>
 
      <!-- TABEL DATA -->
      <div class="card">
        <h3>Data Service</h3>
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Barang</th>
              <th>Customer</th>
              <th>Status</th>
              <th>Foto (1, 2, 3)</th>
              <th>Biaya</th>
              <th>Keterangan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel">
            <tr><td colspan="8" style="color:#94a3b8;">Memuat data dari cloud database...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
 
  <!-- FIREBASE INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJmJXrF4IRqF5X_sD2SRJO7A6SVUGQTpk",
      authDomain: "absensi-lampung.firebaseapp.com",
      projectId: "absensi-lampung",
      storageBucket: "absensi-lampung.firebasestorage.app",
      messagingSenderId: "771796491077",
      appId: "1:771796491077:web:cbb577ab33755f11ad7c2c",
      measurementId: "G-FPVFE0E7HF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dataGlobal = [];

    window.onload = function() {
      if(sessionStorage.getItem("isLoggedIn") === "true") {
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
      }
      document.getElementById("tanggal").valueAsDate = new Date();
      loadRealtimeData();
    };

    window.login = function(){
      let u = document.getElementById("user").value.trim();
      let p = document.getElementById("pass").value.trim();
 
      if(u === "admin" && p === "Elmijimo") {
        sessionStorage.setItem("isLoggedIn", "true");
        document.getElementById("login").style.display = "none";
        document.getElementById("app").style.display = "block";
      } else {
        alert("Username atau Password salah!");
      }
    };
 
    window.logout = function(){
      if(confirm("Apakah Anda yakin ingin logout?")) {
        sessionStorage.removeItem("isLoggedIn");
        document.getElementById("app").style.display = "none";
        document.getElementById("login").style.display = "block";
        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";
      }
    };

    function loadRealtimeData() {
      const q = query(collection(db, "data_service"), orderBy("created_at", "desc"));
      onSnapshot(q, (snapshot) => {
        dataGlobal = [];
        snapshot.forEach((docSnap) => {
          dataGlobal.push({ id: docSnap.id, ...docSnap.data() });
        });
        tampil(dataGlobal);
      });
    }

    function formatRupiah(angka) {
      if (!angka && angka !== 0) return "-";
      return "Rp " + Number(angka).toLocaleString("id-ID");
    }

    function tampil(data){
      let isi = "";
      if (data.length === 0) {
        isi = `<tr><td colspan="8" style="color:#94a3b8;">Belum ada data service.</td></tr>`;
      } else {
        data.forEach((d) => {
          let fotosHtml = '<div class="img-container">';
          fotosHtml += d.foto1 ? `<a href="${d.foto1}" target="_blank"><img src="${d.foto1}" class="img-preview" title="Foto 1"></a>` : '';
          fotosHtml += d.foto2 ? `<a href="${d.foto2}" target="_blank"><img src="${d.foto2}" class="img-preview" title="Foto 2"></a>` : '';
          fotosHtml += d.foto3 ? `<a href="${d.foto3}" target="_blank"><img src="${d.foto3}" class="img-preview" title="Foto 3"></a>` : '';
          fotosHtml += (d.foto1 || d.foto2 || d.foto3) ? '' : '-';
          fotosHtml += '</div>';

          isi += `<tr>
            <td>${d.tanggal}</td>
            <td><b>${d.nama}</b></td>
            <td>${d.customer}</td>
            <td><span style="color:${d.status === 'Masuk' ? '#22c55e' : '#ef4444'}; font-weight:bold;">${d.status}</span></td>
            <td>${fotosHtml}</td>
            <td style="color:#22c55e; font-weight:bold;">${formatRupiah(d.biaya)}</td>
            <td>${d.keterangan || '-'}</td>
            <td><button class="hapus" onclick="hapusData('${d.id}', '${d.nama}')">Hapus</button></td>
          </tr>`;
        });
      }
      document.getElementById("tabel").innerHTML = isi;
    }

    function compressImage(file, maxWidth = 600, maxHeight = 600, quality = 0.6) {
      return new Promise((resolve) => {
        if (!file) { resolve(""); return; }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };
      });
    }

    document.getElementById("formService").addEventListener("submit", async function(e){
      e.preventDefault();
      const btnSimpan = document.getElementById("btnSimpan");
      btnSimpan.innerText = "Mengompres & Menyimpan...";
      btnSimpan.disabled = true;

      try {
        let f1 = document.getElementById("foto1").files[0];
        let f2 = document.getElementById("foto2").files[0];
        let f3 = document.getElementById("foto3").files[0];

        let img1 = await compressImage(f1);
        let img2 = await compressImage(f2);
        let img3 = await compressImage(f3);

        let biayaInput = document.getElementById("biaya").value;

        await addDoc(collection(db, "data_service"), {
          tanggal: document.getElementById("tanggal").value,
          nama: document.getElementById("nama").value.trim(),
          customer: document.getElementById("customer").value.trim(),
          biaya: biayaInput ? Number(biayaInput) : 0,
          keterangan: document.getElementById("keterangan").value.trim(),
          status: document.getElementById("status").value,
          foto1: img1,
          foto2: img2,
          foto3: img3,
          created_at: new Date()
        });

        alert("Data berhasil disimpan!");
        document.getElementById("formService").reset();
        document.getElementById("tanggal").valueAsDate = new Date();
      } catch (err) {
        alert("Gagal menyimpan data: " + err.message);
      } finally {
        btnSimpan.innerText = "Simpan";
        btnSimpan.disabled = false;
      }
    });
 
    window.hapusData = async function(id, nama){
      if(confirm(`Hapus data service "${nama}"?`)) {
        try {
          await deleteDoc(doc(db, "data_service", id));
        } catch (err) {
          alert("Gagal menghapus: " + err.message);
        }
      }
    };
 
    window.downloadExcel = function(){
      if(dataGlobal.length === 0) {
        alert("Tidak ada data untuk diekspor!");
        return;
      }
      let csv = "Tanggal,Barang,Customer,Status,Biaya,Keterangan\n";
      dataGlobal.forEach(d => {
        csv += `"${d.tanggal}","${d.nama}","${d.customer}","${d.status}","${d.biaya || 0}","${d.keterangan || ''}"\n`;
      });
      let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      let url = window.URL.createObjectURL(blob);
      let a = document.createElement("a");
      a.href = url;
      a.download = `Data_Service_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    };
 
    window.printData = function(){
      if(dataGlobal.length === 0) {
        alert("Tidak ada data untuk dicetak!");
        return;
      }
      window.print();
    };
 
    function updateJam(){
      let now = new Date();
      let tgl = now.toLocaleDateString("id-ID", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
      let jam = now.toLocaleTimeString("id-ID");
      document.getElementById("jam").innerHTML = `📅 ${tgl} | ⏰ ${jam} WIB`;
    }
 
    setInterval(updateJam, 1000);
    updateJam();
  </script>
</body>
</html>
